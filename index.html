<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Netflix</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Quem está assistindo?</h1>
            <section aria-label="Perfis disponíveis">
                <nav class="profiles">
                    <a href="#" class="profile">
                        <figure>
                            <img src="/assets/perfil-1.png" alt="Um homem melancólico de estética vitoriana e gótica, vestindo trajes formais desgastados, posa em uma sala sombria iluminada por velas com uma escadaria curva ao fundo.">
                            <figcaption>Gustavo</figcaption>
                        </figure>
                    </a>
                    <a href="#" class="profile">
                        <figure>
                            <img src="/assets/perfil-2.png" alt="Imagem de um boné azul">
                            <figcaption>Thiago</figcaption>
                        </figure>
                    </a>
                    <a href="#" class="profile">
                        <figure>
                            <img src="/assets/perfil-3.jpg" alt="Uma criatura humanoide elemental feita de pedras escuras e fragmentos cristalinos, com chamas azuis ardentes no topo e em seu interior, e olhos brilhantes, é retratada em um cenário sombrio.">
                            <figcaption>Kogeta Iwa</figcaption>
                        </figure>
                    </a>
                    <a href="#" class="profile">
                        <figure>
                            <img src="/assets/perfil-4.png" alt="Uma imagem cinematográfica mostra uma criatura quadrúpede reptiliana com uma carapaça de rochas vulcânicas acidentadas e olhos vermelhos brilhantes, caminhando sobre um campo de lava endurecida em frente a um vulcão ativo sob um céu nublado e fumegante.">
                            <figcaption>Vulcano</figcaption>
                        </figure>
                    </a>
                    <a href="#" class="profile">
                        <figure>
                            <img src="/assets/perfil-5.png" alt="Uma fotografia de médio alcance de um homem vestindo um terno preto bem ajustado e uma máscara de Guy Fawkes (Anonymous), posando em um salão de baile luxuoso e decorado de forma opulenta, com casais dançando em trajes de gala ao fundo.">
                            <figcaption>Vector</figcaption>
                        </figure>
                    </a>
                </nav>
            </section>
        </main>
    </body>
</html>
